<section class="pokemon-list">

  @if (loading()) {
    <p>Chargement…</p>
  } @else if (error()) {
    <p class="error">{{ error() }}</p>
  } @else {
    <div class="pokemon">
      @for (p of allPokemons(); track p.id) {
        <app-pokemon-card [pokemon]="p"></app-pokemon-card>
      } @empty {
        <p>Aucun Pokémon trouvé.</p>
      }
    </div>
  }
</section>
